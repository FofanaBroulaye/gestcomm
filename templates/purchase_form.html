{% extends 'base.html' %}{% block title %}Nouvel achat — GestCom{% endblock %}{% block content %}<header class="header"><div><h1>Nouvel achat</h1><p>Réceptionnez les produits et augmentez le stock.</p></div><a class="btn secondary" href="{{url_for('purchases')}}">Historique</a></header><section class="card form-card"><h2>Réception fournisseur</h2><form method="post"><div class="form-grid"><div class="field"><label>Fournisseur</label><select name="supplier_id">{% for item in suppliers %}<option value="{{item.id}}">{{item.name}}</option>{% endfor %}</select></div><div class="field"><label>Produit *</label><select name="product_id" required>{% for item in products %}<option value="{{item.id}}">{{item.name}}</option>{% endfor %}</select></div><div class="field"><label>Quantité *</label><input type="number" name="quantity" min="1" required></div><div class="field"><label>Coût unitaire *</label><input type="number" step="0.01" min="0" name="unit_cost" required></div></div><div class="form-actions"><button class="btn primary">Réceptionner l'achat</button></div></form></section>{% endblock %}
