{% extends 'base.html' %}{% block title %}Nouvelle vente — GestCom{% endblock %}{% block content %}<header class="header"><div><h1>Nouvelle vente</h1><p>Enregistrez une transaction et mettez le stock à jour.</p></div><a class="btn secondary" href="{{url_for('sales')}}">Historique</a></header><section class="card form-card"><h2>Détails de la vente</h2><form method="post"><div class="form-grid"><div class="field"><label>Client</label><select name="client_id"><option value="">Client comptoir</option>{% for item in clients %}<option value="{{item.id}}">{{item.name}}</option>{% endfor %}</select></div><div class="field"><label>Produit *</label><select name="product_id" required>{% for item in products %}<option value="{{item.id}}">{{item.name}} — {{money(item.price)}} (stock {{item.stock}})</option>{% endfor %}</select></div><div class="field"><label>Quantité *</label><input type="number" name="quantity" min="1" value="1" required></div><div class="field"><label>Moyen de paiement</label><select name="payment_method"><option>Espèces</option><option>Mobile Money</option><option>Carte bancaire</option><option>Virement</option></select></div></div><div class="form-actions"><button class="btn primary">Enregistrer la vente</button></div></form></section>{% endblock %}
